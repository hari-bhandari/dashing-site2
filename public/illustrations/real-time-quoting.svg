<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="An RFQ envelope entering a laptop and leaving as a finished quote, with a stopwatch">
<title>An RFQ envelope entering a laptop and leaving as a finished quote, with a stopwatch</title>
<defs>
  <radialGradient id="glow" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#1f5592" stop-opacity=".85"/><stop offset="1" stop-color="#0c2a4a" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" opacity=".07"/></pattern>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020b16" flood-opacity=".55"/></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <linearGradient id="limeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3e635" stop-opacity=".45"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></linearGradient>
  <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b4577"/><stop offset="1" stop-color="#13365e"/></linearGradient>
</defs>
<rect width="640" height="480" rx="32" fill="#0c2a4a"/>
<rect width="640" height="480" rx="32" fill="url(#glow)"/>
<rect width="640" height="480" rx="32" fill="url(#dots)"/>

  <path d="M150 245 H 200" stroke="#a3e635" stroke-width="2" stroke-dasharray="5 7" fill="none" opacity="0.7" stroke-linecap="round"/><path d="M440 245 H 470" stroke="#a3e635" stroke-width="2" stroke-dasharray="5 7" fill="none" opacity="0.7" stroke-linecap="round"/>
  <g filter="url(#sh)" transform="rotate(-8 95 245)">
    <rect x="40" y="205" width="112" height="78" rx="8" fill="#ffffff"/>
    <path d="M40 210 L96 252 L152 210" fill="none" stroke="#b9c9de" stroke-width="3"/>
    <rect x="58" y="252" width="40" height="18" rx="4" fill="#3b82f6"/>
    <text x="78" y="265" font-family="Barlow, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" >RFQ</text>
  </g>
  <g filter="url(#sh)">
    <rect x="200" y="160" width="240" height="160" rx="12" fill="#0b213c" stroke="#2a5a92" stroke-width="2"/>
    <path d="M178 322 H462 l-12 14 H190 Z" fill="#c8d7ea"/>
    <rect x="292" y="322" width="56" height="5" rx="2.5" fill="#9fb4cf"/>
  </g>
  <rect x="208" y="168" width="224" height="144" rx="7" fill="#0a1f38"/>
  
    <text x="220" y="190" font-family="Barlow, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#8fb0d6" text-anchor="start" >Live price &amp; stock</text>
    <rect x="220" y="204" width="76" height="7" rx="4" fill="#3d6a9e"/><rect x="312" y="204" width="44" height="7" rx="4" fill="#2c5687"/><rect x="372" y="204" width="48" height="7" rx="4" fill="#a3e635"/><rect x="220" y="224" width="76" height="7" rx="4" fill="#3d6a9e"/><rect x="312" y="224" width="44" height="7" rx="4" fill="#2c5687"/><rect x="372" y="224" width="48" height="7" rx="4" fill="#2c5687"/><rect x="220" y="244" width="76" height="7" rx="4" fill="#3d6a9e"/><rect x="312" y="244" width="44" height="7" rx="4" fill="#2c5687"/><rect x="372" y="244" width="48" height="7" rx="4" fill="#a3e635"/><rect x="220" y="264" width="76" height="7" rx="4" fill="#3d6a9e"/><rect x="312" y="264" width="44" height="7" rx="4" fill="#2c5687"/><rect x="372" y="264" width="48" height="7" rx="4" fill="#2c5687"/>
    <rect x="220" y="286" width="200" height="8" rx="4" fill="#1c3a60"/>
    <rect x="220" y="286" width="150" height="8" rx="4" fill="#a3e635"/>
  
  <g filter="url(#sh)">
    <rect x="470" y="150" width="130" height="180" rx="10" fill="#ffffff"/>
  </g>
  <text x="486" y="178" font-family="Barlow, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="800" fill="#0c2a4a" text-anchor="start" >QUOTE</text>
  <rect x="486" y="192" width="98" height="6" rx="4" fill="#d5e0ee"/><rect x="486" y="206" width="80" height="6" rx="4" fill="#d5e0ee"/><rect x="486" y="220" width="90" height="6" rx="4" fill="#d5e0ee"/><rect x="486" y="234" width="70" height="6" rx="4" fill="#d5e0ee"/>
  <line x1="486" y1="256" x2="584" y2="256" stroke="#d5e0ee" stroke-width="2"/>
  <text x="486" y="282" font-family="Barlow, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#5b7392" text-anchor="start" >Total</text>
  <text x="584" y="282" font-family="Barlow, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#0c2a4a" text-anchor="end" >£8,940</text>
  <circle cx="574" cy="310" r="13" fill="#a3e635"/><path d="M568.15 310 l3.9 4.16 l7.8 -8.06" stroke="#0c2a4a" stroke-width="2.86" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#sh)">
    <circle cx="520" cy="92" r="46" fill="url(#panelGrad)" stroke="#2a5a92" stroke-width="2"/>
  </g>
  <rect x="512" y="36" width="16" height="10" rx="3" fill="#8fb0d6"/>
  <circle cx="520" cy="92" r="34" fill="none" stroke="#1c3a60" stroke-width="7"/>
  <path d="M520 58 A34 34 0 0 1 553 100" fill="none" stroke="#a3e635" stroke-width="7" stroke-linecap="round"/>
  <text x="520" y="99" font-family="Barlow, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle" >2 min</text>
  
</svg>