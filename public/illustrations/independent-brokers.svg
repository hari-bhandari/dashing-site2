<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="A broker's laptop showing a quote, with stock, margin and cash panels around it">
<title>A broker's laptop showing a quote, with stock, margin and cash panels around it</title>
<defs>
